service: razorpay-turbo-pod  # required, canonical slug — immutable once registered
displayName: "Razorpay Turbo iOS CocoaPod"  # required, human-readable name — the repo is the CocoaPods distribution of the UPI Turbo iOS SDK: README "# razorpay-turbo-ui-pod / Cocoapod Repository for Turbo Headless Wrapper SDK", and the podspec inside is razorpay-turbo-ui-pod
description: "CocoaPods distribution repository for Razorpay's UPI Turbo iOS SDK: it ships the prebuilt frameworks that bank and merchant iOS apps integrate — the headless RazorpayTurboUPI and TurboUpiPlugin, their UI counterparts RazorpayTurboUPIUI and TurboUpiPluginUI, and a core bundle (CommonLibrary, two_party, Sentry) — together with an example host app that demonstrates integration."  # required, one-sentence description of what the service does — README ("Cocoapod Repository for Turbo Headless Wrapper SDK") plus the repo tree: Pod/headless (RazorpayTurboUPI.framework, TurboUpiPlugin.framework), Pod/ui (RazorpayTurboUPIUI.framework, TurboUpiPluginUI.framework), Pod/core (CommonLibrary.framework, two_party.framework, Sentry.framework) and Example/ with its own Podfile and xcworkspace
type: library  # required, one of: service | worker | cron | library | pipeline — a CocoaPods podspec repository holding prebuilt .framework binaries plus an example app; there is no source service here, no Dockerfile, no helm chart, no Spinnaker application and no Netra deployment. It is consumed by iOS apps through their Podfile
tier: T2  # required, one of: T0 | T1 | T2 | T3 — Payments Reliability sheet Priority P2 → T2, kept. It is a versioned SDK distribution channel rather than a running service, so nothing here can page: a bad pod release reaches users only when a partner app rebuilds and ships
lifecycle: live  # optional, one of: incubating | live | deprecated | retired (default: live)
aliases: ["razorpay-turbo-ui-pod"]  # the name the pod itself is published under and the README's own title — the podspec is razorpay-turbo-ui-pod.podspec and the example target is razorpay-turbo-ui-pod_Example, while the repo is razorpay-turbo-pod

domain: payment-methods/upi  # required, two-level domain/subgroup slug — the Payments Reliability sheet has no BU for this service and the repo has no .github/repo_owners.json, so the family is derived from what it ships: the UPI Turbo iOS SDK, i.e. UPI in-app payments. Area upi, the existing area already used by the merged frontend-upi-sdk (also an SDK) and integrations-upi entries; the owning pod is UPI Experience, whose channel #upi-turbo describes itself as "UPI Experience - UPI Turbo - In App UPI (P2M)"

owner:
  team:  # required, owning team slug — TO FILL: this repo has no CODEOWNERS file, .github/repo_owners.json carries no team slug, and the GitHub repository-teams API is not readable with the current token; ask the POD lead for the owning GitHub team
  pm:  # product manager — TO FILL: no DevRev runnable exists for this repo and it carries no .github/repo_owners.json, so neither a product part nor an org path is available. Ask the Payment Methods / UPI Experience POD lead.

links:
  repo: "https://github.com/razorpay/razorpay-turbo-pod"  # canonical GitHub repo URL
  alerts_repo:  # this service's alert rules in razorpay/alert-rules — TO FILL: no matching ruleset found; add one in razorpay/alert-rules, then link the file here
  slos:  # SLO definitions — TO FILL: no slo.yaml at this repo root and no sloth ruleset for it under razorpay/alert-rules/slo/prod (the two places SLOs are defined today); add one there and link it here
  slack_channel: "#upi-turbo"  # primary Slack channel for this service — 197 members, purpose "UPI Experience - UPI Turbo - In App UPI (P2M)", the product this pod distributes. Releases of exactly this artefact are announced in #upi-turbo-releases (9, purpose "Post here only when a new Turbo front-end / back-end release is done"), which is too small to be the primary; the draft's only candidate, #zomato-razorpay-turbo_integration (19), is one partner integration
  zenduty_policy:  # Zenduty policy/service name used for paging — TO FILL: the service-to-policy mapping is not in DevRev or alert-rules for this service; it lives in the external Zenduty policies sheet
  oncall_handle:  # Slack/PagerDuty oncall handle or usergroup — TO FILL: not set on the DevRev runnable
  runbook:  # link to the incident runbook — TO FILL: no runbook directory for this service in razorpay/rzp-oncall-agent; add one or link the Google Doc / alpha.razorpay.com page
  api_docs:  # API documentation — TO FILL: no swagger/openapi/proto found in the repo tree; link the API spec or Postman collection
  dashboard:  # primary dashboard — TO FILL: Grafana (vajra) / Coralogix dashboard URL for this service (see per-region links below)
  logs_and_traces: "https://razorpay-prod.app.coralogix.in/#/query-new/archive-logs"  # org-standard prod Coralogix — filter subsystem "razorpay-turbo-pod"
  strategy_okr:  # TO FILL: link the FY strategy doc for the owning group.
  risk_assessment:  # TO FILL: no .agents/skills/risk-assessment in this repo; add the per-repo risk-assessment skill
  regions:  # per-region links — TO FILL: no prod region deployment found for this service in spinacode or alert-rules; add a block per geography once it ships

dependencies: []  # optional, declared service dependencies — TO FILL: shape: - service: <slug> for internal deps, - vendor: <name> for external (gateways, banks)
